/* =====================================================================
   THE LEDGER
   Every piece of ground that is spoken for, on one page, the way a
   committee reads it: one line per purchase, not per plot. The 56 family
   lots from the survey are in here too - thin rows, because the old
   records hold little more than a name - since a ledger that showed two
   purchases and omitted 131 plots would be worse than none.
   ===================================================================== */
let ledgerSort = {key:'who', dir:1}, ledgerFilter = 'all';

function ledgerRows(){
  const rows = [];
  allSales().forEach(function(s){
    const ps = postState(s);
    rows.push({
      who: s.buyer || '', plots: saleplotNames(s.plotIds).join(', '), count: s.plotIds.length,
      size: s.sizePlot || '', status: statusOf(plotById(s.plotIds[0])) || 'reserved',
      date: s.date || '', paid: s.price ? Number(s.price) : '',
      markers: !ps ? '' : ps.state === 'done' ? 'set'
             : ps.state === 'overdue' ? ps.days + ' days over'
             : ps.state === 'unknown' ? 'not confirmed' : ps.days + ' days left',
      late: !!(ps && ps.state === 'overdue'),
      contact: [s.email, s.phone].filter(Boolean).join(' · '),
      saleId: s.saleId, source: 'app'
    });
  });
  (D.lots.features || []).forEach(function(f){
    const p = f.properties;
    rows.push({
      who: p.owner || '', plots: p.plots || '', count: '', size: p.size || '',
      status: 'sold', date: '', paid: '', markers: 'not confirmed', late: false,
      contact: '', saleId: '', source: 'survey'
    });
  });
  const f = ledgerFilter;
  return rows.filter(function(r){
    if(f === 'reserved') return r.status === 'reserved';
    if(f === 'sold')     return r.status === 'sold';
    if(f === 'late')     return r.late;
    if(f === 'app')      return r.source === 'app';
    return true;
  }).sort(function(a,b){
    const k = ledgerSort.key;
    const A = a[k] == null ? '' : a[k], B = b[k] == null ? '' : b[k];
    if(typeof A === 'number' && typeof B === 'number') return (A - B) * ledgerSort.dir;
    return String(A).localeCompare(String(B)) * ledgerSort.dir;
  });
}

const LEDGER_COLS = [
  {k:'who',     h:'Purchaser / owner'},
  {k:'plots',   h:'Plots'},
  {k:'size',    h:'Size'},
  {k:'status',  h:'Status'},
  {k:'date',    h:'Purchased'},
  {k:'paid',    h:'Paid'},
  {k:'markers', h:'Corner markers'},
  {k:'contact', h:'Contact'}
];

function ledgerSortBy(k){
  ledgerSort = {key:k, dir: ledgerSort.key === k ? -ledgerSort.dir : 1};
  showLedger();
}
function ledgerFilterBy(f){ ledgerFilter = f; showLedger(); }

function ledgerTable(forPrint){
  const rows = ledgerRows();
  const head = LEDGER_COLS.map(function(c){
    const arrow = ledgerSort.key === c.k ? (ledgerSort.dir > 0 ? ' ▲' : ' ▼') : '';
    return forPrint ? '<th>' + c.h + '</th>'
                    : '<th onclick="ledgerSortBy(\'' + c.k + '\')">' + c.h + arrow + '</th>';
  }).join('');
  const body = rows.map(function(r){
    return '<tr' + (r.late ? ' class="late"' : '') + '>' +
      '<td>' + esc(r.who) + (r.source === 'survey' ? ' <span class="src">survey</span>' : '') + '</td>' +
      '<td>' + esc(r.plots) + '</td>' +
      '<td>' + esc(r.size) + '</td>' +
      '<td>' + LABEL[r.status] + '</td>' +
      '<td>' + esc(fmtDate(r.date) || '') + '</td>' +
      '<td>' + (r.paid === '' ? '' : '$' + r.paid) + '</td>' +
      '<td>' + esc(r.markers) + '</td>' +
      '<td>' + esc(r.contact) + '</td></tr>';
  }).join('');
  return '<table class="ledger"><thead><tr>' + head + '</tr></thead><tbody>' + body +
    '</tbody></table>' + (rows.length ? '' : '<p class="note">Nothing to show.</p>');
}

function showLedger(){
  const all = ledgerRows().length;
  const chip = function(f, label){
    return '<button class="chip' + (ledgerFilter === f ? ' on' : '') +
           '" onclick="ledgerFilterBy(\'' + f + '\')">' + label + '</button>';
  };
  openPanel(
    '<h2>The ledger</h2>' +
    '<p class="note" style="margin-top:0">Every piece of ground that is spoken for. ' + all +
      ' line' + (all === 1 ? '' : 's') + ' &mdash; tap a heading to sort.</p>' +
    '<div class="ledgerchips">' + chip('all','All') + chip('app','Recorded here') +
      chip('reserved','Reserved') + chip('sold','Sold') + chip('late','Markers overdue') + '</div>' +
    '<div class="ledgerwrap">' + ledgerTable(false) + '</div>' +
    '<button class="btn" onclick="printLedger()">&#128424; Print this</button>' +
    '<button class="btn sec" onclick="exportLedger()">&#128190; Save it as a spreadsheet</button>' +
    '<button class="btn sec" onclick="closePanel()">Close</button>');
}

function printLedger(){
  const w = window.open('', '_blank');
  if(!w){ toast('Allow pop-ups so it can open'); return; }
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Millfield Cemetery — ledger</title>' +
    '<style>@page{size:letter landscape;margin:.6in}' +
    'body{font:10pt/1.4 Georgia,serif;color:#000}' +
    'h1{font-size:13pt;text-align:center;margin:0 0 4px}' +
    '.sub{text-align:center;font-size:9pt;color:#444;margin:0 0 16px}' +
    'table{width:100%;border-collapse:collapse}' +
    'th,td{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top}' +
    'th{background:#eee;font-size:9pt;text-transform:uppercase;letter-spacing:.4px}' +
    'tr.late td{background:#f6e4e1}' +
    '.src{font-size:8pt;color:#666}' +
    '</style></head><body>' +
    '<h1>MILLFIELD CHURCH CEMETERY &mdash; RECORD OF PLOTS SOLD AND RESERVED</h1>' +
    '<p class="sub">' + esc(fmtDate(today())) + '</p>' +
    ledgerTable(true) + '</body></html>');
  w.document.close();
}

function exportLedger(){
  const rows = ledgerRows();
  if(!rows.length){ toast('Nothing to save'); return; }
  const head = LEDGER_COLS.map(c => c.h).concat(['Plots in sale','Source']);
  const csv = [head.join(',')].concat(rows.map(function(r){
    return LEDGER_COLS.map(c => csvCell(r[c.k])).concat([csvCell(r.count), csvCell(r.source)]).join(',');
  })).join('\r\n');
  download('millfield-ledger-' + today() + '.csv', csv, 'text/csv');
  toast(rows.length + ' lines saved');
}

/* =====================================================================
   THE MENU
   The same things the icons down the side do, said in words. Nobody who
   opens this twice a year remembers what a satellite dish or a padlock
   means, and they should not have to.
   ===================================================================== */
function menuItem(icon, label, fn){
  return '<button onclick="closeMenu();' + fn + '"><span class="ic">' + icon + '</span>' + label + '</button>';
}
function buildMenu(){
  const basemapName = ['Esri imagery','Virginia VBMP imagery','Street map'][window._baseIndex || 0];
  return menuItem('&#128269;', 'Find a name or a plot', 'openSearch()') +
    menuItem('&#9776;', 'Choose what to show', 'openLayers()') +
    menuItem('&#128752;', 'Background: ' + basemapName, 'nextBasemap()') +
    menuItem('&#128205;', 'Show me where I am', 'locateMe()') +
    (isAdmin
      ? '<div class="sep">Committee</div>' +
        menuItem('&#9881;', 'Committee tools &mdash; ledger, letters', 'adminPanel()') +
        menuItem('&#128275;', 'Sign out', 'signOut()')
      : menuItem('&#128274;', 'Committee sign-in', 'adminPanel()')) +
    '<div class="sep">About</div>' +
    menuItem('&#8505;', 'About this map', 'showAbout()');
}
function toggleMenu(){
  const m = $('#menu');
  if(m.classList.contains('on')) return closeMenu();
  m.innerHTML = buildMenu();
  m.style.top = ($('#topbar').getBoundingClientRect().bottom + 6) + 'px';
  m.classList.add('on');
}
function closeMenu(){ $('#menu').classList.remove('on'); }

/* ---- the caveat, in one place, used on the map, the letter and About ----
   The church has a survey of its property line. It has never had one tying the
   cemetery's own plots to that line - the committee decided against the
   expense, and instead a plot is proved when the purchaser sets the corner
   markers. So the app must not imply an accuracy it does not have. */
const SURVEY_CAVEAT =
  'Plot positions are the church’s own layout, not a boundary survey. The property line shown is from ' +
  'the church’s survey, but the plots have never been surveyed against it. Plots near the line may not ' +
  'exist as drawn, and a plot is confirmed when the purchaser sets the four corner markers.';

function showSurveyNote(){
  const over = D.plots.features.filter(f => f.properties.overLine);
  openPanel(
    '<h2>About the plot positions</h2>' +
    '<p class="note" style="margin-top:0">' + SURVEY_CAVEAT + '</p>' +
    (over.length
      ? '<div class="overdue"><b>' + over.length + ' plots are drawn over the line</b>' +
        '<p class="note" style="margin-top:6px">They are outlined in broken red on the map. Those are the ones ' +
        'that may not exist as drawn, and each is proved &mdash; or not &mdash; when its corner markers go in.</p></div>'
      : '') +
    '<div class="sec-h">What the map is good for</div>' +
    '<p class="note" style="margin-top:0">Finding a grave, and seeing what lies around it. Plot to plot and ' +
      'plot to corner marker, the layout is accurate &mdash; it all came off one drawing. Stand at a marked ' +
      'corner post and count along, and the map will agree with you.</p>' +
    '<div class="sec-h">What it is not good for</div>' +
    '<p class="note" style="margin-top:0">Deciding where the property line falls. That is a surveyor&rsquo;s ' +
      'work, and the committee has chosen to prove each plot as it is sold rather than survey the whole ' +
      'cemetery.</p>' +
    '<button class="btn sec" onclick="closePanel()">Close</button>');
}

function showAbout(){
  openPanel(
    '<h2>Millfield Church Cemetery</h2>' +
    '<p class="note" style="margin-top:0">A map of the cemetery drawn from the church&rsquo;s own survey: ' +
      D.plots.features.length + ' plots, ' + D.burials.features.length + ' burials, ' +
      (D.lots.features||[]).length + ' family lots.</p>' +
    '<div class="sec-h">Anyone can</div>' +
    '<p class="note" style="margin-top:0">Find a grave by name, see which plots are still available, and stand ' +
      'in the cemetery and see what is around them. Burial names and dates are public, as they are on the stones.</p>' +
    '<div class="sec-h">The committee can</div>' +
    '<p class="note" style="margin-top:0">Record burials and sales, print a record of purchase, keep the ledger, ' +
      'and track the ' + POST_DAYS + ' days for corner markers and the ' + STONE_DAYS + ' days for a headstone. ' +
      'Purchasers&rsquo; addresses, telephone numbers and prices are kept private and need a sign-in.</p>' +
    '<div class="sec-h">The plot positions</div>' +
    '<p class="note" style="margin-top:0">' + SURVEY_CAVEAT + '</p>' +
    '<div class="sec-h">Keeping it</div>' +
    '<p class="note" style="margin-top:0">The record lives in the cloud, free, and any committee member can add ' +
      'the next one. <b>Export the whole record</b> writes it all out as plain files that Excel and any mapping ' +
      'program can read, with no account and no subscription &mdash; keep the newest one with the church papers.</p>' +
    '<p class="note">Millfield Baptist Church Cemetery Committee &middot; ' + CHURCH.tel + '</p>' +
    '<p class="note" style="font-size:14px">Version ' + BUILD + ' &middot; ' +
      (navigator.onLine ? 'online' : 'no signal') + '</p>' +
    '<button class="btn sec" onclick="location.reload()">&#8635; Check for a newer version</button>' +
    '<button class="btn sec" onclick="closePanel()">Close</button>');
}

/* the map buttons, callable by name so the menu can say what they do */

}
function openLayers(){
  $('#layers').classList.add('on'); $('#btnLayers').classList.add('on');
}

/* ---------- the committee door ---------- */
function adminPanel(){
  if(isAdmin){
    const waiting = deviceOnlyIds().length;
    const mine = Object.keys(rec).length;
    openPanel(
      '<h2>Committee mode</h2>' +
      '<p class="note">Signed in as <b>' + esc((cloud.user && cloud.user.email) || 'this device') + '</b>.<br>' +
        mine + ' plot' + (mine===1?'':'s') + ' recorded through the app · ' + cloudLabel() + '.</p>' +
      (waiting ? '<button class="btn adm" onclick="pushDeviceOnly()">&#11014; Send ' + waiting +
                 ' device-only change' + (waiting===1?'':'s') + ' to the cloud</button>' : '') +
      '<button class="btn" onclick="showLedger()">&#128203; The ledger &mdash; everything sold and reserved</button>' +
      salesSection() + stonesSection() +
      '<div class="sec-h">Keep a copy</div>' +
      '<button class="btn" onclick="exportAll()">&#128190; Export the whole record (CSV + GeoJSON)</button>' +
      '<p class="note">The plain-file copy of everything. Keep the newest one somewhere safe — Excel reads ' +
        'the CSV, any mapping program reads the GeoJSON, and neither needs an account or a subscription.</p>' +
      '<button class="btn sec" onclick="exportChanges()">&#128228; Export just the app changes for ArcGIS</button>' +
      '<div class="sec-h">Who can record</div>' +
      (members.length
        ? members.map(function(m){
            const me = cloud.user && cloud.user.email === m.email;
            return '<div class="kv"><span class="k">' + esc(m.email) + (me ? ' (you)' : '') + '</span>' +
              (me ? '<span class="v">&mdash;</span>'
                  : '<button class="v" style="color:#8C2F26;font-weight:700" onclick="removeMember(\'' +
                    esc(m.email) + '\')">Remove</button>') + '</div>';
          }).join('')
        : '<p class="note">Nobody listed yet.</p>') +
      '<label class="f" style="margin-top:12px"><span>Add a committee member</span>' +
        '<input type="email" id="mEmail" placeholder="their email address"></label>' +
      '<button class="btn sec" onclick="addMember()">&#10133; Add them</button>' +
      '<p class="note">They sign in with that email on their own phone &mdash; the sign-in screen will make ' +
        'them an account the first time. Anyone on this list can add the next one, so the committee can hand ' +
        'itself on without help from anybody.</p>' +
      '<button class="btn sec" onclick="signOut()">&#128275; Sign out</button>' +
      '<button class="btn sec" onclick="closePanel()">Close</button>');
    return;
  }
  openPanel(
    '<h2>Committee sign-in</h2>' +
    '<p class="note">For recording burials and sales. Visitors do not need this.</p>' +
    '<label class="f"><span>Email</span><input type="email" id="ae" autocomplete="username" value="' +
      esc(localStorage.getItem('millfield_email')||'') + '"></label>' +
    '<label class="f"><span>Password</span><input type="password" id="ap" autocomplete="current-password"></label>' +
    '<button class="btn adm" onclick="signIn()">Sign in</button>' +
    '<button class="btn sec" onclick="signUp()">First time — make my sign-in</button>' +
    '<p class="note">Making a sign-in does not by itself let you change anything. A committee member has to ' +
      'put your email on the roll first.</p>' +
    (cloud.ready ? '' : '<p class="note">No connection right now — the first sign-in on a device needs one. ' +
                        'After that it holds, and the app keeps working at the cemetery with no signal.</p>') +
    '<button class="btn sec" onclick="closePanel()">Cancel</button>');
  setTimeout(function(){
    const el = $('#ap');
    if(el) el.onkeydown = function(ev){ if(ev.key === 'Enter') signIn(); };
  }, 120);
}

function signIn(){
  if(!cloud.ready){ toast('No connection to sign in with'); return; }
  const em = ($('#ae').value||'').trim().toLowerCase(), pw = $('#ap').value||'';
  if(!em || !pw){ toast('Email and password, please'); return; }
  auth.signInWithEmailAndPassword(em, pw)
    .then(function(){ localStorage.setItem('millfield_email', em); closePanel(); })
    .catch(function(e){
      toast(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password'
        ? 'Email or password not recognised' : (e.code || e.message), 4000);
    });
}
function signUp(){
  if(!cloud.ready){ toast('No connection to sign up with'); return; }
  const em = ($('#ae').value||'').trim().toLowerCase(), pw = $('#ap').value||'';
  if(!em || pw.length < 6){ toast('Email, and a password of at least six characters'); return; }
  auth.createUserWithEmailAndPassword(em, pw)
    .then(function(){ localStorage.setItem('millfield_email', em); closePanel(); })
    .catch(function(e){
      toast(e.code === 'auth/email-already-in-use'
        ? 'That email already has a sign-in — use Sign in' : (e.code || e.message), 4000);
    });
}
function signOut(){ if(auth) auth.signOut(); closePanel(); }

function adminOn(){
  if(isAdmin) return;
  isAdmin = true;
  document.body.classList.add('isadmin');
  $('#topbar').classList.add('admin');
  $('#btnAdmin').textContent = '🧰';                    // tools, not a padlock
  $('#btnAdmin').title = 'Committee tools — the ledger, letters, exports';
  $('#btnAdmin').classList.add('on','adminbtn');
  toast('Committee mode — tap a plot to record on it, or ⚙ Committee tools for the ledger', 5000);
}
function adminOff(quiet){
  if(!isAdmin) return;
  isAdmin = false;
  document.body.classList.remove('isadmin');
  $('#topbar').classList.remove('admin');
  $('#btnAdmin').textContent = '🔒';
  $('#btnAdmin').title = 'Committee sign-in';
  $('#btnAdmin').classList.remove('on');
  ['posts','aerial','survey'].forEach(function(k){
    const cb = $('#layers input[data-l="' + k + '"]');
    if(cb){ cb.checked = false; setLayer(k, false); }
  });
  const bl = $('#layers input[data-l="blocks"]');
  if(bl){ bl.checked = true; setLayer('blocks', true); }
  if(!quiet) toast('Signed out');
}

/* ---------- filters ---------- */
function applyFilter(){
  layerPlots.eachLayer(function(l){
    const s = plotStyle(l.feature.properties);
    const show = filter !== 'available' || statusOf(l.feature.properties) === 'available';
    l.setStyle({fillOpacity: show ? s.fillOpacity : .05, opacity: show ? s.opacity : .12});
  });
  layerBurials.eachLayer(function(l){
    const show = filter === 'veterans' ? !!l.feature.properties.vet : (filter !== 'available');
    l.setStyle({opacity: show ? 1 : 0, fillOpacity: show ? 1 : 0});
  });
  layerAppBurials.getLayers().forEach(function(l, i){
    const show = filter === 'veterans' ? !!(appList[i] && appList[i].vet) : (filter !== 'available');
    l.setStyle({opacity: show ? 1 : 0, fillOpacity: show ? 1 : 0});
  });
}

/* ---------- wiring ---------- */
function wire(){
  $$('#filters .chip').forEach(function(b){
    b.onclick = function(){
      $$('#filters .chip').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); filter = b.dataset.f; applyFilter();
    };
  });

  const BASES = [{l:function(){ return baseAerial; }, i:'🛰', n:'Esri imagery'},
                 {l:function(){ return baseVGIN;   }, i:'🇻', n:'Virginia VBMP imagery'},
                 {l:function(){ return basePlain;  }, i:'🗺', n:'Street map'}];
  let bi = 0;
  window._baseIndex = 0;
  $('#btnBase').onclick = function(){
    map.removeLayer(BASES[bi].l());
    bi = (bi + 1) % BASES.length;
    window._baseIndex = bi;
    BASES[bi].l().addTo(map);
    $('#btnBase').textContent = BASES[bi].i;
    toast(BASES[bi].n);
  };

  $('#btnLocate').onclick = function(){
    if(!navigator.geolocation) return;
    $('#btnLocate').classList.add('on');
    navigator.geolocation.getCurrentPosition(function(p){
      const ll = [p.coords.latitude, p.coords.longitude];
      if(meMarker) map.removeLayer(meMarker);
      meMarker = L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#1F6FEB',fillOpacity:1}).addTo(map);
      map.setView(ll, 20);
      $('#btnLocate').classList.remove('on');
    }, function(){ $('#btnLocate').classList.remove('on'); toast('Could not get your location'); },
       {enableHighAccuracy:true, timeout:15000});
  };

  $('#btnLayers').onclick = function(){
    const p = $('#layers');
    p.classList.toggle('on');
    $('#btnLayers').classList.toggle('on', p.classList.contains('on'));
  };
  $('#layersClose').onclick = function(){
    $('#layers').classList.remove('on'); $('#btnLayers').classList.remove('on');
  };
  $$('#layers input[data-l]').forEach(function(cb){ cb.onchange = syncLayers; });

  $('#btnAerial').onclick = function(){ aerialShow(!$('#aerialbar').classList.contains('on')); };
  $('#aerialClose').onclick = function(){ aerialShow(false); };
  $('#aerialOp').oninput = function(e){ if(aerial) aerial.setOpacity(e.target.value/100); };
  $('#btnSurvey').onclick = function(){ surveyShow(!$('#surveybar').classList.contains('on')); };
  $('#surveyClose').onclick = function(){ surveyShow(false); };
  $('#surveyOp').oninput = function(e){ if(survey) survey.setOpacity(e.target.value/100); };

  $('#btnAdmin').onclick = adminPanel;

  $('#btnSearch').onclick = function(){
    const s = $('#search'); s.classList.toggle('on');
    if(s.classList.contains('on')) $('#q').focus(); else $('#results').classList.remove('on');
  };
  $('#q').oninput = function(e){
    const q = e.target.value.trim().toLowerCase();
    const box = $('#results');
    if(q.length < 2){ box.classList.remove('on'); return; }
    /* one list: the surveyed burials, everything recorded since - so a name
       entered this morning is findable this afternoon - and the plots
       themselves, because the committee looks for "M28" far more often than
       it looks for a person */
    const all = D.burials.features.map(function(f){
        return {who:f.properties, ll:[f.geometry.coordinates[1], f.geometry.coordinates[0]]};
      }).concat(appList.map(function(b){ return {who:b, ll:b.ll}; }));
    const people = all.filter(h => (h.who.name||'').toLowerCase().includes(q));
    /* match either the survey's lot number or whatever the committee typed,
       so both "20" and "F20" find the same plot */
    const plots = D.plots.features.filter(function(f){
        const bare = (f.properties.plot || '').toLowerCase();
        const full = plotName(f.properties).toLowerCase();
        return (bare && bare.indexOf(q) === 0) || (full && full.indexOf(q) === 0);
      }).slice(0,25).map(function(f){
        return {plot:f.properties, ll:plotCenter(f)};
      });
    const hits = plots.concat(people).slice(0,40);
    box.innerHTML = hits.length
      ? hits.map(function(h,i){
          if(h.plot){
            const st = statusOf(h.plot);
            const e  = rec[h.plot.id];
            return '<button data-i="' + i + '"><div class="nm">Plot ' + esc(plotName(h.plot)) + '</div>' +
              '<div class="dt">' + LABEL[st] + (e && e.buyer ? ' &middot; ' + esc(e.buyer)
                                              : h.plot.owner ? ' &middot; ' + esc(h.plot.owner) : '') +
              '</div></button>';
          }
          return '<button data-i="' + i + '"><div class="nm">' + esc(h.who.name) +
            '</div><div class="dt">' + esc(years(h.who.birth, h.who.death)) + '</div></button>';
        }).join('')
      : '<div class="empty">Nothing found by that name or plot number.</div>';
    box.classList.add('on');
    box.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){
        const h = hits[+b.dataset.i];
        map.setView(h.ll, 21);
        box.classList.remove('on'); $('#search').classList.remove('on'); $('#q').value = '';
        if(h.plot) showPlot(h.plot.id); else showBurial(h.who);
      };
    });
  };

  $('#panel').onclick = function(e){ if(e.target.id === 'panel') closePanel(); };
  // a tap anywhere else puts the menu away
  document.addEventListener('click', function(e){
    if(!$('#menu').classList.contains('on')) return;
    if(e.target.closest('#menu') || e.target.closest('#btnMenu')) return;
    closeMenu();
  });
  wireDrag();
}

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

/* ---- telling you when there is a newer version ----
   The phone has no way to ask for one: a home-screen app has no address bar,
   and pulling down is swallowed by the map. So the app checks for itself - on
   opening, whenever it is brought back to the front, and every half hour it
   is left running - by reading the build number off the server and comparing
   it with its own. Costs a couple of hundred bytes. */
function checkForUpdate(){
  if(!navigator.onLine) return;
  fetch('sw.js?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.text() : ''; })
    .then(function(t){
      const m = /const BUILD = (\d+)/.exec(t);
      if(m && +m[1] > BUILD) $('#updatebar').classList.add('on');
    })
    .catch(function(){});
}
document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkForUpdate(); });
/* pageshow fires when iOS brings a suspended app back without reloading it,
   which is the usual way a home-screen app is reopened - visibilitychange
   alone can miss it. */
window.addEventListener('pageshow', function(){ setTimeout(checkForUpdate, 800); });
window.addEventListener('focus', checkForUpdate);
setTimeout(checkForUpdate, 1500);
setInterval(checkForUpdate, 30 * 60 * 1000);

load().catch(function(e){
  $('#loading').innerHTML = '<div style="padding:24px;text-align:center">Could not load the cemetery data.<br><small>' +
    esc(e.message) + '</small></div>';
});
